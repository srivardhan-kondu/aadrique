# AADRIQUE — single-server nginx config (no Docker).
#
# Serves the built React app as static files and forwards /api to the uvicorn
# process managed by deploy/aadrique-api.service.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aadrique
#   sudo ln -s /etc/nginx/sites-available/aadrique /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (this rewrites the file with the certbot blocks):
#   sudo certbot --nginx -d aadrique.in -d www.aadrique.in

server {
    listen 80;
    listen [::]:80;
    server_name aadrique.in www.aadrique.in;

    # Path to the output of `yarn build`.
    root /var/www/aadrique;
    index index.html;

    access_log /var/log/nginx/aadrique.access.log;
    error_log  /var/log/nginx/aadrique.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/xhtml+xml image/svg+xml;

    client_max_body_size 1m;

    # Forward the API to uvicorn on localhost so the browser only ever talks to
    # one origin — no CORS preflight. Requires the frontend to be built with an
    # empty REACT_APP_BACKEND_URL.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Content-hashed bundles are safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }

    # index.html must never be cached, or visitors keep loading the old bundle
    # references after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # SPA fallback: client-side routes like /capabilities/ai-consulting must
    # return index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
